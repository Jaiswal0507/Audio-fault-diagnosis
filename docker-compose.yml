version: '3.8'

services:
  backend:
    build: ./backend
    container_name: machinesense_backend
    ports:
      - "8000:8000"
    volumes:
      # This maps your local 'data' folder to the container
      # So if the container restarts, the SQLite database isn't wiped out
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/machinesense.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: machinesense_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped